name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PROYECTO: Blazor_Ecommerce.csproj

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore ${{ env.PROYECTO }}

      - name: Compilar
        run: dotnet build ${{ env.PROYECTO }} --configuration Release --no-restore

      - name: Publicar
        run: dotnet publish ${{ env.PROYECTO }} --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Desplegar a MonsterASP.NET (solo desde main)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}